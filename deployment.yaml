apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: my-app:latest
          ports:
            - containerPort: 8000
          imagePullPolicy: Never
          # optional resource limits
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: express-app
spec:
  selector:
    app: express-app
  ports:
    - name: http-metrics # <-- add a name here
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
